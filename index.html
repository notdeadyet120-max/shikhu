<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For My Shikhu 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stars"></div>
  <div class="floating-hearts" id="floatingHearts"></div>

  <header class="header">
    <h1 class="title">for my shikhu <span class="beat">💖</span></h1>
    <p class="subtitle">pop a bubble, get a little love note ✨</p>
  </header>

  <main class="stage" id="stage"></main>

  <div class="controls">
    <button id="playAgain" class="play-btn">play again 🫧</button>
    <p class="counter">popped: <span id="popCount">0</span> / 200</p>
  </div>

  <div class="popup" id="popup">
    <div class="popup-card">
      <div class="popup-heart">💗</div>
      <p class="popup-text" id="popupText"></p>
      <button class="popup-close" id="popupClose">awww ✨</button>
    </div>
  </div>

  <footer class="footer">made with 💖 open heartz</footer>

  <script src="script.js"></script>
</body>
</html>
